name: Deploy to VPS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the PHP-FPM version running in production (see deploy job below).
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run test suite
        run: ./vendor/bin/phpunit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Only deploy on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            export COMPOSER_ALLOW_SUPERUSER=1
            export PAGER=cat
            export GIT_PAGER=cat

            cd /var/www/shamandora

            echo "==> Fetch & reset to origin/main"
            git fetch --all --prune
            git reset --hard origin/main
            git clean -fd -e .env -e storage/ -e node_modules/ -e vendor/ -e whatsapp-bridge/auth_info* -e whatsapp-bridge/node_modules/

            echo "==> Composer"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Frontend build"
            # Vite lives in devDependencies — install full deps to build, then prune.
            npm install
            npm run build
            npm prune --omit=dev || true

            echo "==> Migrate"
            php artisan migrate --force --no-interaction

            echo "==> Cache"
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Permissions & services"
            chown -R www-data:www-data /var/www/shamandora
            systemctl restart php8.3-fpm
            systemctl reload nginx

            echo "==> Queue worker (systemd)"
            if [ -f /var/www/shamandora/deploy/laravel-queue.service ]; then
              install -m 644 /var/www/shamandora/deploy/laravel-queue.service /etc/systemd/system/laravel-queue.service
              systemctl daemon-reload
              systemctl enable laravel-queue.service
              systemctl restart laravel-queue.service
              systemctl --no-pager --full status laravel-queue.service || true
            else
              systemctl try-restart laravel-queue.service 2>/dev/null || true
            fi

            # Or pm2 queue if present (legacy)
            if command -v pm2 >/dev/null 2>&1; then
              pm2 restart shamandora-queue 2>/dev/null || true
            fi

            echo "==> Deployed $(git rev-parse --short HEAD)"
            git log -1 --oneline
