name: Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH port reachability
        run: |
          echo "Testing TCP 22 to ${{ secrets.VPS_HOST }}"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22' \
            && echo "✅ Port 22 reachable" \
            || (echo "❌ Port 22 NOT reachable" && exit 1)

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          debug: true
          script: |
            set -e
            cd /var/www/shamandora
            git fetch --all
            git reset --hard origin/main
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            chown -R www-data:www-data /var/www/shamandora
            systemctl restart php8.3-fpm
            systemctl reload nginx
