name: Deploy to VPS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the PHP-FPM version running in production (see deploy job below).
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend (Vite)
        run: npm run build

      - name: Pint style check (Domain + Requests + Resources + Policies)
        run: >
          ./vendor/bin/pint --test
          app/Domain
          app/Http/Requests
          app/Http/Resources
          app/Http/Controllers/HealthController.php
          app/Http/Controllers/LookupTableController.php
          app/Http/Controllers/API/GamesApiController.php
          app/Http/Controllers/API/AttendanceApiController.php
          app/Http/Middleware/ShareAuthRoleFlags.php
          app/Console/Commands/ReportFailedJobs.php
          app/Support/ManualPrimaryKey.php
          app/Models/MedicineInventory.php
          app/Models/MedicineLocation.php
          app/Models/MedicineStock.php
          app/Models/MedicineDispenseRecord.php
          app/Models/PersonPhoneNumber.php
          app/Models/Game.php
          app/Policies
          app/Providers/AuthServiceProvider.php

      - name: Run test suite (sqlite)
        run: ./vendor/bin/phpunit

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shamandora_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, pdo_mysql
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Full suite stays on sqlite; MySQL job covers hot Domain + security paths.
      - name: Run MySQL smoke suite
        run: >
          ./vendor/bin/phpunit -c phpunit.mysql.xml
          tests/Feature/HealthEndpointTest.php
          tests/Feature/HotPathSmokeTest.php
          tests/Feature/PhaseASecurityTest.php
          tests/Feature/LookupCrudTest.php
          tests/Unit/CustodyRequestServiceTest.php
          tests/Unit/PlaceBookingServiceTest.php
          tests/Unit/PersonSpecialCaseServiceTest.php
          tests/Unit/SeasonEventBookingPaymentServiceTest.php
          tests/Unit/LiveFormCapacityServiceTest.php
          tests/Unit/LiveFormDuplicateCheckTest.php
          tests/Unit/ManualPrimaryKeyTest.php


  deploy:
    runs-on: ubuntu-latest
    needs: [test, test-mysql]
    # Only deploy on pushes to main, never on pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 22
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            export COMPOSER_ALLOW_SUPERUSER=1
            export PAGER=cat
            export GIT_PAGER=cat

            cd /var/www/shamandora

            echo "==> Fetch & reset to origin/main"
            git fetch --all --prune
            PREV_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            git reset --hard origin/main
            git clean -fd -e .env -e storage/ -e node_modules/ -e vendor/ -e whatsapp-bridge/auth_info* -e whatsapp-bridge/node_modules/
            DEPLOY_SHA="$(git rev-parse HEAD)"
            echo "Previous: ${PREV_SHA:-none} → Deployed: ${DEPLOY_SHA}"

            echo "==> Composer"
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "==> Frontend build"
            # Vite lives in devDependencies — install full deps to build, then prune.
            npm install
            npm run build
            npm prune --omit=dev || true

            echo "==> Migrate"
            php artisan migrate --force --no-interaction

            echo "==> Sentry release + log channel hints in .env"
            if [ -f .env ]; then
              if grep -q '^SENTRY_RELEASE=' .env; then
                sed -i "s|^SENTRY_RELEASE=.*|SENTRY_RELEASE=${DEPLOY_SHA}|" .env
              else
                printf '\nSENTRY_RELEASE=%s\n' "${DEPLOY_SHA}" >> .env
              fi
              if grep -q '^LOG_CHANNEL=' .env; then
                sed -i 's|^LOG_CHANNEL=.*|LOG_CHANNEL=daily|' .env
              else
                printf '\nLOG_CHANNEL=daily\n' >> .env
              fi
            fi

            echo "==> Cache"
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "==> Permissions & services"
            chown -R www-data:www-data /var/www/shamandora
            systemctl restart php8.3-fpm
            systemctl reload nginx

            echo "==> Redis (install if missing; drivers still controlled by .env)"
            if ! command -v redis-server >/dev/null 2>&1; then
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server
            fi
            systemctl enable --now redis-server 2>/dev/null || true
            redis-cli ping || true

            echo "==> Queue worker (systemd)"
            if [ -f /var/www/shamandora/deploy/laravel-queue.service ]; then
              install -m 644 /var/www/shamandora/deploy/laravel-queue.service /etc/systemd/system/laravel-queue.service
              systemctl daemon-reload
              systemctl enable laravel-queue.service
              systemctl restart laravel-queue.service
              systemctl --no-pager --full status laravel-queue.service || true
            else
              systemctl try-restart laravel-queue.service 2>/dev/null || true
            fi

            echo "==> Laravel scheduler (cron)"
            if [ -f /var/www/shamandora/deploy/laravel-scheduler.cron ]; then
              install -m 644 /var/www/shamandora/deploy/laravel-scheduler.cron /etc/cron.d/shamandora-scheduler
            fi

            # Stop legacy pm2 queue so only systemd consumes jobs (avoids duplicate side effects).
            if command -v pm2 >/dev/null 2>&1; then
              pm2 stop shamandora-queue 2>/dev/null || true
              pm2 delete shamandora-queue 2>/dev/null || true
            fi

            echo "==> Post-deploy health check (fails deploy if unhealthy)"
            php deploy/check-health.php

            echo "==> Deployed $(git rev-parse --short HEAD) release=${DEPLOY_SHA} (rollback tip: git reset --hard ${PREV_SHA:-unknown})"
            git log -1 --oneline
            php artisan tinker --execute="echo 'release=' . (config('sentry.release') ?: config('app.release') ?: 'null') . PHP_EOL . 'log=' . config('logging.default') . PHP_EOL;" 2>/dev/null || true
